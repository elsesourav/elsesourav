name: Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: preview-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build & Deploy Preview Channel
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository

    env:
      CI: true
      NODE_ENV: test
      NEXT_PUBLIC_SITE_URL: https://elsesourav.com
      NEXT_PUBLIC_SUPABASE_URL: https://srfevooktrqjzjuddmko.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_test_dummy_key_ci
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js 22 with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Validate code quality
        run: |
          pnpm typecheck
          pnpm turbo lint
          pnpm turbo test

      - name: Build preview bundle
        run: pnpm --filter @elsesourav/web build

      - name: Deploy to Firebase Hosting Preview Channel
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ELSESOURAV }}
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ELSESOURAV }}
          projectId: elsesourav
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 7d
