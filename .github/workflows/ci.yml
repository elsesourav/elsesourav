name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    env:
      CI: true
      NODE_ENV: test
      NEXT_PUBLIC_SITE_URL: https://elsesourav.com
      NEXT_PUBLIC_SUPABASE_URL: https://srfevooktrqjzjuddmko.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_test_dummy_key_ci
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js 22 with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: TypeScript strict typecheck
        run: pnpm typecheck

      - name: ESLint code quality & security rules
        run: pnpm turbo lint

      - name: Vitest test suite
        run: pnpm turbo test

      - name: Build Next.js production bundle
        run: pnpm --filter @elsesourav/web build
