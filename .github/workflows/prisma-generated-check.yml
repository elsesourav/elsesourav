name: Prisma Generated Client Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  prisma-generated-client-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Prisma generated client
        run: npm run ci:verify-prisma-generated
