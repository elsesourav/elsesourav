name: Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual release dispatch'
        required: false
        default: 'Manual production promotion'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Production Release Gate & Deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://elsesourav.com

    env:
      CI: true
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: https://elsesourav.com
      NEXT_PUBLIC_SUPABASE_URL: https://srfevooktrqjzjuddmko.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js 22 with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Pre-deployment quality validation
        run: |
          pnpm typecheck
          pnpm turbo lint
          pnpm turbo test

      - name: Build verified production bundle & sitemap
        run: pnpm --filter @elsesourav/web build

      - name: Deploy to Firebase Hosting (Live Production)
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ELSESOURAV }}
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ELSESOURAV }}
          projectId: elsesourav
          channelId: live
